name: Validate Token Lists

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.5.2
        run: corepack prepare yarn@4.5.2 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: corepack yarn install

      - name: TypeScript type checking
        run: corepack yarn typecheck

      - name: Build project
        run: corepack yarn build:token-service

      - name: Check token list integrity
        run: |
          echo "🔍 Validating token list integrity..."
          
          # Check if required files exist
          for file in "packages/token-service/data/banned.json" "packages/token-service/data/strict-tokens.json"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done
          
          # Validate JSON syntax
          echo "📋 Validating JSON syntax..."
          for file in packages/token-service/data/*.json; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Invalid JSON in $file"
              exit 1
            else
              echo "✅ Valid JSON: $file"
            fi
          done

      - name: Generate and validate output lists
        run: |
          echo "🏗️ Generating token lists..."
          corepack yarn generate-lists
          
          echo "📊 Validating generated lists..."
          
          # Check generated files exist
          for file in "packages/token-service/dist/all.json" "packages/token-service/dist/strict.json" "packages/token-service/dist/banned.json"; do
            if [ ! -f "$file" ]; then
              echo "❌ Generated file missing: $file"
              exit 1
            fi
          done
          
          # Validate generated JSON
          for file in packages/token-service/dist/*.json; do
            if ! jq empty "$file" 2>/dev/null; then
              echo "❌ Invalid generated JSON in $file"
              exit 1
            fi
          done
          
          echo "✅ All generated files are valid"

      - name: Token list statistics
        run: |
          echo "📈 Token List Statistics:"
          echo "========================"
          
          if [ -f "packages/token-service/dist/all.json" ]; then
            ALL_COUNT=$(jq '.tokens | length' packages/token-service/dist/all.json)
            echo "📋 All tokens: $ALL_COUNT"
          fi
          
          if [ -f "packages/token-service/dist/strict.json" ]; then
            STRICT_COUNT=$(jq '.tokens | length' packages/token-service/dist/strict.json)
            echo "⭐ Strict tokens: $STRICT_COUNT"
          fi
          
          if [ -f "packages/token-service/dist/banned.json" ]; then
            BANNED_COUNT=$(jq '.banned | length' packages/token-service/dist/banned.json)
            echo "🚫 Banned tokens: $BANNED_COUNT"
          fi
          
          echo "========================"

      - name: Check for duplicate tokens
        run: |
          echo "🔍 Checking for duplicate tokens..."
          
          # Check duplicates in all.json
          if [ -f "packages/token-service/dist/all.json" ]; then
            DUPLICATES=$(jq -r '.tokens[].objectId' packages/token-service/dist/all.json | sort | uniq -d)
            if [ -n "$DUPLICATES" ]; then
              echo "❌ Duplicate objectIds found in all.json:"
              echo "$DUPLICATES"
              exit 1
            else
              echo "✅ No duplicates in all.json"
            fi
          fi
          
          # Check duplicates in strict.json
          if [ -f "packages/token-service/dist/strict.json" ]; then
            DUPLICATES=$(jq -r '.tokens[].objectId' packages/token-service/dist/strict.json | sort | uniq -d)
            if [ -n "$DUPLICATES" ]; then
              echo "❌ Duplicate objectIds found in strict.json:"
              echo "$DUPLICATES"
              exit 1
            else
              echo "✅ No duplicates in strict.json"
            fi
          fi

      - name: Validate token schema
        run: |
          echo "🔍 Validating token schema..."
          
          # Check required fields in all.json
          if [ -f "packages/token-service/dist/all.json" ]; then
            MISSING_FIELDS=$(jq -r '.tokens[] | select(.name == null or .symbol == null or .decimals == null or .objectId == null) | .objectId // "unknown"' packages/token-service/dist/all.json)
            if [ -n "$MISSING_FIELDS" ]; then
              echo "❌ Tokens with missing required fields:"
              echo "$MISSING_FIELDS"
              exit 1
            else
              echo "✅ All tokens have required fields"
            fi
          fi

      - name: Security checks
        run: |
          echo "🔒 Running basic security checks..."
          
          # Basic validation only - URL security checks removed
          echo "✅ Basic security checks passed"