name: Generate Token Lists

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/token-service/data/strict-tokens.json'
      - 'packages/token-service/data/banned.json'
      - 'packages/token-service/data/verified-tokens.json'
      - 'packages/token-service/data/all-verified-tokens.json'
      - 'packages/token-service/data/polar-verified.json'
  pull_request:
    paths:
      - 'packages/token-service/data/strict-tokens.json' 
      - 'packages/token-service/data/banned.json'
      - 'packages/token-service/data/verified-tokens.json'
      - 'packages/token-service/data/all-verified-tokens.json'
      - 'packages/token-service/data/polar-verified.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.5.2
        run: corepack prepare yarn@4.5.2 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: corepack yarn install

      - name: Build project
        run: corepack yarn build:token-service

      - name: Validate token data
        run: corepack yarn validate

      - name: Generate token lists
        run: corepack yarn generate-lists

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet packages/token-service/dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Show generated files info
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "📊 Generated token lists:"
          echo "- all.json: $(jq '.tokens | length' packages/token-service/dist/all.json) tokens"
          echo "- strict.json: $(jq '.tokens | length' packages/token-service/dist/strict.json) tokens"
          echo "- banned.json: $(jq '.banned | length' packages/token-service/dist/banned.json) banned tokens"
          echo "- polar-verified.json: $(jq '.totalCount' packages/token-service/dist/polar-verified.json) tokens"

      - name: Commit generated files
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/token-service/dist/
          git commit -m "🤖 Auto-generate token lists

          - all.json: $(jq '.tokens | length' packages/token-service/dist/all.json) tokens
          - strict.json: $(jq '.tokens | length' packages/token-service/dist/strict.json) tokens  
          - banned.json: $(jq '.banned | length' packages/token-service/dist/banned.json) banned tokens
          - polar-verified.json: $(jq '.totalCount' packages/token-service/dist/polar-verified.json) tokens
          
          Generated from commit: ${{ github.sha }}"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        run: git push

      - name: Comment on PR
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const allTokens = JSON.parse(fs.readFileSync('packages/token-service/dist/all.json', 'utf8'));
            const strictTokens = JSON.parse(fs.readFileSync('packages/token-service/dist/strict.json', 'utf8'));
            const bannedTokens = JSON.parse(fs.readFileSync('packages/token-service/dist/banned.json', 'utf8'));
            const polarVerifiedTokens = JSON.parse(fs.readFileSync('packages/token-service/dist/polar-verified.json', 'utf8'));
            
            const comment = `## 🤖 Token Lists Generated
            
            | List | Count | Status |
            |------|-------|--------|
            | All Tokens | ${allTokens.tokens.length} | ✅ |
            | Strict Tokens | ${strictTokens.tokens.length} | ✅ |
            | Banned Tokens | ${bannedTokens.banned.length} | ✅ |
            | Polar Verified | ${polarVerifiedTokens.totalCount} | ✅ |
            
            **Updated:** ${new Date().toISOString()}
            
            The token lists have been automatically generated and are ready for review.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });