name: Deploy Token Lists

on:
  push:
    branches: [main]
    paths: 
      - 'dist/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.5.2
        run: corepack prepare yarn@4.5.2 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: corepack yarn install

      - name: Build project
        run: corepack yarn build

      - name: Generate token lists
        run: corepack yarn generate-lists

      - name: Prepare deployment files
        run: |
          echo "📦 Preparing deployment files..."
          
          # Create deployment directory
          mkdir -p deploy
          
          # Copy token lists from token service
          cp packages/token-service/dist/*.json deploy/
          
          # Create index.html for GitHub Pages
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Polar Token Lists</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 40px; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .list-item { background: #f5f5f5; padding: 20px; margin: 10px 0; border-radius: 8px; }
                  .list-item h3 { margin-top: 0; }
                  .endpoint { background: #e8f4f8; padding: 10px; border-radius: 4px; font-family: monospace; }
                  .stats { color: #666; font-size: 14px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🌟 Polar Token Lists</h1>
                  <p>Curated SUI token lists for DEXs, wallets, and DApps</p>
                  
                  <div class="list-item">
                      <h3>📋 All Tokens</h3>
                      <p>Complete list of verified SUI tokens from BlockBerry</p>
                      <div class="endpoint">https://your-domain.github.io/polar-token-list/all.json</div>
                      <div class="stats" id="all-stats">Loading...</div>
                  </div>
                  
                  <div class="list-item">
                      <h3>⭐ Strict Tokens</h3>
                      <p>Manually curated high-quality tokens for DEX interfaces</p>
                      <div class="endpoint">https://your-domain.github.io/polar-token-list/strict.json</div>
                      <div class="stats" id="strict-stats">Loading...</div>
                  </div>
                  
                  <div class="list-item">
                      <h3>🚫 Banned Tokens</h3>
                      <p>Blacklisted tokens to exclude from applications</p>
                      <div class="endpoint">https://your-domain.github.io/polar-token-list/banned.json</div>
                      <div class="stats" id="banned-stats">Loading...</div>
                  </div>
                  
                  <h2>📖 Usage</h2>
                  <pre><code>// Fetch all tokens
          const response = await fetch('https://your-domain.github.io/polar-token-list/all.json');
          const tokenList = await response.json();
          console.log(`Loaded ${tokenList.tokens.length} tokens`);</code></pre>
                  
                  <h2>🔄 Updates</h2>
                  <p>Token lists are updated automatically:</p>
                  <ul>
                      <li><strong>Weekly:</strong> Fresh verified tokens from BlockBerry</li>
                      <li><strong>On-demand:</strong> When team updates strict or banned lists</li>
                  </ul>
              </div>
              
              <script>
                  // Load and display stats
                  async function loadStats() {
                      try {
                          const [all, strict, banned] = await Promise.all([
                              fetch('./all.json').then(r => r.json()),
                              fetch('./strict.json').then(r => r.json()),
                              fetch('./banned.json').then(r => r.json())
                          ]);
                          
                          document.getElementById('all-stats').textContent = 
                              `${all.tokens.length} tokens • Updated: ${new Date(all.updatedAt).toLocaleDateString()}`;
                          document.getElementById('strict-stats').textContent = 
                              `${strict.tokens.length} tokens • Updated: ${new Date(strict.updatedAt).toLocaleDateString()}`;
                          document.getElementById('banned-stats').textContent = 
                              `${banned.banned.length} banned • Updated: ${new Date(banned.updatedAt).toLocaleDateString()}`;
                      } catch (error) {
                          console.error('Failed to load stats:', error);
                      }
                  }
                  
                  loadStats();
              </script>
          </body>
          </html>
          EOF
          
          # Create CORS headers file for GitHub Pages
          cat > deploy/_headers << 'EOF'
          /*.json
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Access-Control-Allow-Headers: Content-Type
            Cache-Control: public, max-age=300, stale-while-revalidate=600
          EOF

      - name: Display deployment info
        run: |
          echo "📊 Deployment Summary:"
          echo "======================"
          ls -la deploy/
          echo ""
          echo "Token Lists:"
          for file in deploy/*.json; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" == "all.json" || "$filename" == "strict.json" ]]; then
                count=$(jq '.tokens | length' "$file")
                echo "- $filename: $count tokens"
              elif [[ "$filename" == "banned.json" ]]; then
                count=$(jq '.banned | length' "$file")
                echo "- $filename: $count banned"
              fi
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment success
        run: |
          echo "🎉 Deployment successful!"
          echo "📍 Token lists available at: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "🔗 Direct endpoints:"
          echo "- All tokens: ${{ steps.deployment.outputs.page_url }}all.json"
          echo "- Strict tokens: ${{ steps.deployment.outputs.page_url }}strict.json"
          echo "- Banned tokens: ${{ steps.deployment.outputs.page_url }}banned.json"