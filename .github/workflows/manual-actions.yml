name: Manual Actions

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync-blockberry'
        type: choice
        options:
          - sync-blockberry
          - regenerate-lists
          - validate-only
          - deploy-only
      target_count:
        description: 'Target token count (for sync-blockberry)'
        required: false
        default: '1000'
        type: string

jobs:
  manual-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.5.2
        run: corepack prepare yarn@4.5.2 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: corepack yarn install

      - name: Build project
        run: corepack yarn build

      - name: Sync BlockBerry tokens
        if: github.event.inputs.action == 'sync-blockberry'
        run: |
          echo "🔄 Syncing verified tokens from BlockBerry..."
          echo "Target count: ${{ github.event.inputs.target_count }}"
          
          # Backup current file
          cp packages/token-service/data/all-verified-tokens.json packages/token-service/data/all-verified-tokens.backup.json || echo "No existing file"
          
          # Sync from BlockBerry
          corepack yarn workspace @polar/token-service discover-all-verified
          
          # Copy to main file
          cp packages/token-service/data/all-verified-tokens.json packages/token-service/data/verified-tokens.json
          
          # Show changes
          OLD_COUNT=$(jq '. | length' packages/token-service/data/all-verified-tokens.backup.json 2>/dev/null || echo "0")
          NEW_COUNT=$(jq '. | length' packages/token-service/data/all-verified-tokens.json)
          echo "📊 Token count: $OLD_COUNT → $NEW_COUNT"
        env:
          BLOCKBERRY_API_KEY: ${{ secrets.BLOCKBERRY_API_KEY }}

      - name: Regenerate token lists
        if: github.event.inputs.action == 'regenerate-lists' || github.event.inputs.action == 'sync-blockberry'
        run: |
          echo "🏗️ Regenerating token lists..."
          corepack yarn generate-lists
          
          echo "📊 Generated lists:"
          echo "- All tokens: $(jq '.tokens | length' packages/token-service/dist/all.json)"
          echo "- Strict tokens: $(jq '.tokens | length' packages/token-service/dist/strict.json)"
          echo "- Banned tokens: $(jq '.banned | length' packages/token-service/dist/banned.json)"

      - name: Validate only
        if: github.event.inputs.action == 'validate-only'
        run: |
          echo "✅ Running validation..."
          corepack yarn validate
          corepack yarn typecheck
          echo "✅ Validation completed successfully"

      - name: Deploy to GitHub Pages
        if: github.event.inputs.action == 'deploy-only' || github.event.inputs.action == 'regenerate-lists' || github.event.inputs.action == 'sync-blockberry'
        run: |
          echo "🚀 Preparing deployment..."
          
          # Create deployment directory
          mkdir -p deploy
          cp packages/token-service/dist/*.json deploy/
          
          # Create simple index
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><title>Polar Token Lists</title></head>
          <body>
            <h1>Polar Token Lists</h1>
            <ul>
              <li><a href="all.json">All Tokens</a></li>
              <li><a href="strict.json">Strict Tokens</a></li>
              <li><a href="banned.json">Banned Tokens</a></li>
            </ul>
          </body></html>
          EOF

      - name: Setup Pages
        if: github.event.inputs.action == 'deploy-only' || github.event.inputs.action == 'regenerate-lists' || github.event.inputs.action == 'sync-blockberry'
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        if: github.event.inputs.action == 'deploy-only' || github.event.inputs.action == 'regenerate-lists' || github.event.inputs.action == 'sync-blockberry'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        if: github.event.inputs.action == 'deploy-only' || github.event.inputs.action == 'regenerate-lists' || github.event.inputs.action == 'sync-blockberry'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit changes
        if: github.event.inputs.action == 'sync-blockberry' || github.event.inputs.action == 'regenerate-lists'
        run: |
          if ! git diff --quiet; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .
            git commit -m "🔧 Manual action: ${{ github.event.inputs.action }}

            Triggered by: ${{ github.actor }}
            Action: ${{ github.event.inputs.action }}
            Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Action summary
        run: |
          echo "✅ Manual action completed: ${{ github.event.inputs.action }}"
          echo "🕐 Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "👤 Triggered by: ${{ github.actor }}"
          
          if [[ "${{ github.event.inputs.action }}" == *"deploy"* ]]; then
            echo "🌐 Deployed to: ${{ steps.deployment.outputs.page_url }}"
          fi